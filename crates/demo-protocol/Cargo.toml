[package]
name = "demo-protocol"
version = "1.0.0"
edition = "2021"
license = "MIT"

[dependencies]
hmi-core = { path = "../hmi-core" }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
tokio-serial = "5"
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tempfile = "3"
async-trait = "0.1"

[build-dependencies]
static_vcruntime = "3"
