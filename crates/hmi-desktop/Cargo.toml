[package]
name = "hmi-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
native-preview-smoke = []

[dependencies]
base64.workspace = true
hmi-core = { path = "../hmi-core" }
hmi-python = { path = "../hmi-python" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
tauri.workspace = true
tauri-plugin-dialog = "2"
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
tempfile.workspace = true
sha2.workspace = true
zip = { version = "4", default-features = false, features = ["deflate"] }
walkdir = "2"
dirs = "6"

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading"] }
