<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Runtime layout harness</title>
    <style>
      html, body, #app { width: 100%; height: 100%; margin: 0; }
      #app { display: flex; }
      .runtime-host { width: 100%; height: 100%; flex: initial; }
      .runtime-frame { position: relative; flex-shrink: 0; }
      .runtime-page { position: absolute; top: 0; left: 0; transform-origin: top left; background: white; }
      .runtime-widget { position: absolute; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./runtime-layout-harness.ts"></script>
  </body>
</html>
